<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Todo List</title>
</head>
<body>
    <header>
        <h1>Todo List</h1>
    </header>

    <div id="sidebar">
        <div id="sidebar-actions">
            <button><img id="sidebar-collapse-icon" src="assets/icons/arrow-collapse-left.svg" alt="collapse sidebar" height="30px"></button>
        </div>
        <div id="view-button-container">
            <button class="sidebar-button"><img src="assets/icons/plus-circle.svg" alt="plus-circle" height="30px">Add Todo</button>
            <button class="sidebar-button"><img src="assets/icons/calendar-blank.svg" alt="calendar-blank" height="30px">Due Today</button>
            <button class="sidebar-button"><img src="assets/icons/calendar-month.svg" alt="calendar-month" height="30px">Upcoming</button>
        </div>
        <div>
            <h2 id="projects-header">
                Projects
                <button><img title="Add new project" src="assets/icons/plus.svg" alt="plus" height="30px"></button>
            </h2>
            <div id="projects-container"></div>
        </div>
        <div>
        </div>
    </div>

    <main>
        
    </main>
</body>
</html>
