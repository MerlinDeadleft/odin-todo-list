<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Todo List</title>
</head>

<body>
    <header>
        <h1>Todo List</h1>
    </header>

    <div id="sidebar">
        <div id="sidebar-actions">
            <button class="sidebar-button rounded" id="sidebar-collapse-button">
                <img class="auto-mask-icon" id="sidebar-collapse-icon" title="Collapse sidebar"
                    src="assets/icons/arrow-collapse-left.svg" alt="collapse sidebar" height="30px">
            </button>
        </div>
        <div class="view-button-container">
            <button class="sidebar-button view-button" data-view-type="add-todo" title="Add Todo">
                <img class="auto-mask-icon" src="assets/icons/plus-circle.svg" alt="" height="30px">
                Add Todo
            </button>
            <button class="sidebar-button view-button" data-view-type="due-today" title="Due Today">
                <img class="auto-mask-icon" src="assets/icons/calendar-blank.svg" alt="" height="30px">
                Due Today
            </button>
            <button class="sidebar-button view-button" data-view-type="upcoming" title="Upcoming">
                <img class="auto-mask-icon" src="assets/icons/calendar-month.svg" alt="" height="30px">
                Upcoming
            </button>
        </div>
        <div>
            <div id="projects-header">
                <h2>Projects</h2>
                <button class="sidebar-button rounded" id="add-project-button">
                    <img class="auto-mask-icon" title="Add new project" src="assets/icons/plus.svg"
                        alt="Add New Project" height="30px">
                </button>
            </div>
            <div id="projects-button-container" class="view-button-container">
                <button class="sidebar-button view-button" data-view-type="project" title="Default Project">
                    <img class="auto-mask-icon" src="assets/icons/checkbox-blank.svg" alt="" height="50px">
                    Default Project
                </button>
            </div>
        </div>
        <div>
        </div>
    </div>

    <main>

    </main>
</body>

</html>
